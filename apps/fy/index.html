<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>欢乐翻译 · 欢乐工具站</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231B4A7A'/%3E%3Ctext x='32' y='44' font-size='32' text-anchor='middle' fill='%23fff' font-family='serif' font-weight='bold'%3E译%3C/text%3E%3C/svg%3E">
<style>
:root{--page:#E9EFF7;--card:#fff;--soft:#EEF3F8;--line:#D0D8E4;--navy:#1B4A7A;--blue:#0F6CBD;--ink:#111418;--sub:#6B7280;--ph:#A8B3C4}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.topbar{display:flex;justify-content:space-between;align-items:center;max-width:720px;margin:0 auto;padding:14px 16px 0}
.topbar a{color:var(--blue);text-decoration:none;font-size:14px;font-weight:600}
.hero{text-align:center;padding:18px 16px 14px}
.hero h1{font-size:24px;color:var(--navy);letter-spacing:1px}
.hero p{font-size:13px;color:var(--sub);margin-top:4px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 40px}
.bigcard{background:var(--card);border-radius:24px;box-shadow:0 2px 14px rgba(27,74,122,.08);padding:18px 18px 14px;position:relative}
.langbar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.langbtn{flex:1;display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit}
.langbtn:hover{border-color:var(--navy)}
.langbtn .arr{color:var(--navy);font-size:12px;margin-left:8px;flex:none}
.swapbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:17px;color:var(--navy);flex:none;transition:transform .25s}
.swapbtn:active{transform:rotate(180deg)}
.inwrap{position:relative}
.inwrap textarea{width:100%;min-height:120px;max-height:260px;overflow-y:auto;border:none;outline:none;resize:none;font-size:24px;font-weight:700;line-height:1.5;color:var(--ink);background:transparent;padding:10px 44px 6px 2px;font-family:inherit}
.inwrap textarea::placeholder{color:var(--ph);font-weight:800}
.clearx{position:absolute;top:8px;right:4px;width:30px;height:30px;border:none;background:#E5EAF2;border-radius:50%;color:var(--sub);font-size:13px;cursor:pointer;display:none;line-height:1}
.clearx.on{display:block}
.clearx:hover{background:#D6DDE9}
.toolrow{display:flex;align-items:center;gap:10px;padding:10px 2px 4px}
.solidbtn{width:46px;height:46px;border:none;border-radius:14px;background:var(--navy);color:#fff;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.solidbtn:hover{background:#15406A}
.count{margin-left:auto;font-size:12px;color:var(--sub)}
.divider{border-top:1px dashed var(--line);margin:8px 0}
.outwrap{min-height:110px}
#out{font-size:23px;font-weight:700;line-height:1.55;color:var(--ink);padding:10px 2px 4px;word-break:break-word;white-space:pre-wrap}
#out.empty::before{content:'翻译';color:var(--ph);font-weight:800}
#out.busy{color:var(--ph)}
#out.busy::before{content:'翻译中…'}
#out.rough{color:var(--ink);opacity:.72}
#out.rough::after{content:' （初译，AI 精译中…）';color:var(--ph);font-size:14px;font-weight:400;font-style:italic}
.outrow{display:flex;align-items:center;gap:8px;padding:8px 2px 2px;min-height:36px}
.pillbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 15px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.pillbtn:hover{background:var(--soft)}
.ghost{width:36px;height:36px;border:none;background:transparent;border-radius:9px;font-size:16px;color:var(--navy);cursor:pointer}
.ghost:hover{background:var(--soft)}
.ghost:disabled{color:#B8C2D0;cursor:default}
.enginetag{margin-left:auto;font-size:11px;color:var(--sub)}
.phcard{background:var(--soft);border-radius:24px;margin-top:16px;padding:18px}
.phcard h2{font-size:17px;color:var(--blue);margin-bottom:10px}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.cats button{border:none;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;background:transparent;color:var(--ink);cursor:pointer}
.cats button.on{background:var(--blue);color:#fff}
.phlist .ph{display:flex;align-items:flex-start;gap:10px;padding:11px 8px;border-radius:12px;cursor:pointer}
.phlist .ph:hover{background:#fff}
.phlist .ph:active{background:#E3EBF5}
.phlist .spk{flex:none;width:32px;height:32px;border:none;border-radius:50%;background:transparent;font-size:15px;color:var(--blue);cursor:pointer}
.phlist .spk:hover{background:#D8E4F2}
.phlist .en{font-size:16px;font-weight:700;color:var(--navy)}
.phlist .zh{font-size:13px;color:var(--sub);margin-top:2px}
.fbrow{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:10px 8px 0;color:var(--sub);font-size:13px}
.fbrow button{border:none;background:transparent;font-size:15px;cursor:pointer}
.foot{text-align:center;padding:22px 0 0;font-size:12px;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 语言选择弹层（必应式底部抽屉） */
.mask{position:fixed;inset:0;background:rgba(17,24,39,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(100%);width:100%;max-width:720px;max-height:76vh;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -6px 30px rgba(27,74,122,.25);z-index:55;display:flex;flex-direction:column;transition:transform .25s}
.sheet.on{transform:translateX(-50%) translateY(0)}
.shhead{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 10px;flex:none}
.shhead b{font-size:17px;color:var(--navy)}
.shclose{border:none;background:#E5EAF2;width:30px;height:30px;border-radius:50%;color:var(--sub);font-size:13px;cursor:pointer}
.shclose:hover{background:#D6DDE9}
.shbody{overflow-y:auto;padding:0 6px 20px}
.shgroup{font-size:12px;color:var(--sub);padding:12px 14px 6px;font-weight:600}
.shrow{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;cursor:pointer;border-radius:12px}
.shrow:hover{background:var(--soft)}
.shrow b{font-size:16px;color:var(--ink);font-weight:700}
.shrow .dot{width:20px;height:20px;border-radius:50%;border:2px solid #C3CCDA;flex:none}
.shrow.sel .dot{border-color:var(--blue);background:radial-gradient(circle,var(--blue) 0 5px,#fff 6px)}
@media(max-width:520px){
 .langbtn{font-size:14px;padding:11px 10px}
 .inwrap textarea{font-size:20px}
 #out{font-size:19px}
}
.topbar .pill{display:inline-block;padding:7px 16px;border:1.5px solid rgba(27,74,122,.3);border-radius:99px;background:#fff;color:var(--navy);font-size:13px;font-weight:600;transition:all .15s}
.topbar .pill:hover{background:var(--navy);color:#fff}
</style>
</head>
<body>
<div class="topbar"><span style="font-size:13px;color:var(--sub)">tl.efcc.cc/fy</span><a class="pill" href="/">← 返回工具站</a></div>
<div class="hero"><h1>欢乐翻译</h1><p>多语言互译 · 自动识别 · 语音朗读</p></div>
<div class="wrap">

  <div class="bigcard">
    <div class="langbar">
      <button class="langbtn" id="lsrc"><span id="lsrcn">中文 (简体)</span><span class="arr">▼</span></button>
      <button class="swapbtn" id="swap" title="交换语言">⇄</button>
      <button class="langbtn" id="ltgt"><span id="ltgtn">英语</span><span class="arr">▼</span></button>
    </div>
    <div class="inwrap">
      <textarea id="src" placeholder="输入文本" maxlength="2000"></textarea>
      <button class="clearx" id="clr" title="清空">✕</button>
    </div>
    <div class="toolrow">
      <button class="solidbtn" id="paste" title="粘贴剪贴板">📋</button>
      <button class="solidbtn" id="go" style="background:var(--blue)" title="翻译">译</button>
      <span class="count" id="count">0 / 2000</span>
    </div>
    <div class="divider"></div>
    <div class="outwrap"><div id="out" class="empty"></div></div>
    <div class="outrow">
      <button class="pillbtn" id="redo">↻ 重新翻译</button>
      <button class="ghost" id="tts" title="朗读译文">🔊</button>
      <button class="ghost" id="cp" title="复制译文" disabled>⧉</button>
      <span class="enginetag" id="eng"></span>
    </div>
  </div>

  <div class="phcard">
    <h2>常见短语</h2>
    <div class="cats" id="cats"></div>
    <div class="phlist" id="phlist"></div>
    <div class="fbrow">翻译质量如何？<button id="good" title="好">👍</button><button id="bad" title="差">👎</button></div>
  </div>

  <div class="foot">欢乐翻译 · 欢乐工具站出品 · 双引擎：MyMemory + Cloudflare AI</div>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="shhead"><b id="shtitle">选择语言</b><button class="shclose" id="shclose">✕</button></div>
  <div class="shbody" id="shbody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const src=$('src'),out=$('out'),go=$('go'),clr=$('clr'),paste=$('paste'),
      lsrc=$('lsrc'),ltgt=$('ltgt'),lsrcn=$('lsrcn'),ltgtn=$('ltgtn'),swap=$('swap'),redo=$('redo'),tts=$('tts'),cp=$('cp'),
      count=$('count'),eng=$('eng'),toast=$('toast'),cats=$('cats'),phlist=$('phlist'),
      mask=$('mask'),sheet=$('sheet'),shbody=$('shbody'),shtitle=$('shtitle'),shclose=$('shclose');
let busy=false,lastText='',lastOut='',lastTgt='',seqNo=0;
let tt;function show(m){toast.textContent=m;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),1800)}

/* 语言表：n=名称 t=朗读语音代码 */
const LANGS={
 zh:{n:'中文 (简体)',t:'zh-CN'},
 en:{n:'英语',t:'en-US'},
 ja:{n:'日语',t:'ja-JP'},
 ko:{n:'韩语',t:'ko-KR'},
 fr:{n:'法语',t:'fr-FR'},
 de:{n:'德语',t:'de-DE'},
 ru:{n:'俄语',t:'ru-RU'},
 es:{n:'西班牙语',t:'es-ES'},
 pt:{n:'葡萄牙语',t:'pt-BR'},
 it:{n:'意大利语',t:'it-IT'},
 th:{n:'泰语',t:'th-TH'},
 vi:{n:'越南语',t:'vi-VN'},
 ar:{n:'阿拉伯语',t:'ar-SA'},
 hi:{n:'印地语',t:'hi-IN'},
 id:{n:'印尼语',t:'id-ID'},
 ms:{n:'马来语',t:'ms-MY'},
 tr:{n:'土耳其语',t:'tr-TR'},
 uk:{n:'乌克兰语',t:'uk-UA'},
 nl:{n:'荷兰语',t:'nl-NL'},
 pl:{n:'波兰语',t:'pl-PL'}
};
let srcLang='zh',tgtLang='en';
let recent=['zh','en'];
try{const r=JSON.parse(localStorage.getItem('fy_recent')||'');if(Array.isArray(r)&&r.length)recent=r.filter(x=>LANGS[x]).slice(0,3)}catch(e){}

function saveRecent(code){
  recent=[code,...recent.filter(x=>x!==code)].slice(0,3);
  try{localStorage.setItem('fy_recent',JSON.stringify(recent))}catch(e){}
}
function renderLangs(){lsrcn.textContent=LANGS[srcLang].n;ltgtn.textContent=LANGS[tgtLang].n}

/* 语言弹层 */
let pickSide='src';
function openSheet(side){
  pickSide=side;
  shtitle.textContent=side==='src'?'从哪种语言翻译？':'翻译成哪种语言？';
  const cur=side==='src'?srcLang:tgtLang;
  shbody.innerHTML='';
  if(recent.length>1){
    const g=document.createElement('div');g.className='shgroup';g.textContent='最近使用';
    shbody.appendChild(g);
    recent.forEach(code=>shbody.appendChild(mkRow(code,cur)));
  }
  const g2=document.createElement('div');g2.className='shgroup';g2.textContent='全部语言';
  shbody.appendChild(g2);
  Object.keys(LANGS).forEach(code=>shbody.appendChild(mkRow(code,cur)));
  mask.classList.add('on');sheet.classList.add('on');
  shbody.scrollTop=0;
}
function mkRow(code,cur){
  const r=document.createElement('div');r.className='shrow'+(code===cur?' sel':'');
  const b=document.createElement('b');b.textContent=LANGS[code].n;
  const d=document.createElement('span');d.className='dot';
  r.appendChild(b);r.appendChild(d);
  r.onclick=()=>{
    if(pickSide==='src'){
      const old=srcLang;srcLang=code;
      if(srcLang===tgtLang)tgtLang=old;
    }else{
      const old=tgtLang;tgtLang=code;
      if(tgtLang===srcLang)srcLang=old;
    }
    saveRecent(code);renderLangs();closeSheet();
    lastText='';out.className='empty';out.textContent='';cp.disabled=true;eng.textContent='';
    if(src.value.trim())doTrans(true);
  };
  return r;
}
function closeSheet(){mask.classList.remove('on');sheet.classList.remove('on')}
lsrc.onclick=()=>openSheet('src');
ltgt.onclick=()=>openSheet('tgt');
mask.onclick=closeSheet;shclose.onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

swap.onclick=()=>{
  [srcLang,tgtLang]=[tgtLang,srcLang];renderLangs();
  if(lastOut){src.value=lastOut.slice(0,2000);lastText='';lastOut='';out.className='empty';out.textContent='';cp.disabled=true;eng.textContent='';upd();if(src.value.trim())doTrans(true)}
  show(LANGS[srcLang].n+' → '+LANGS[tgtLang].n);
};

/* 输入区 */
function upd(){count.textContent=src.value.length+' / 2000';clr.classList.toggle('on',src.value.length>0)}
src.addEventListener('input',upd);
src.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();doTrans()}
});
clr.onclick=()=>{src.value='';upd();out.className='empty';out.textContent='';lastText='';lastOut='';cp.disabled=true;eng.textContent='';src.focus()};

/* 翻译核心 */
async function doTrans(auto){
  const text=src.value.trim();
  if(!text){show('请先输入要翻译的内容');src.focus();return}
  if(busy)return;
  if(text===lastText&&tgtLang===lastTgt&&!auto){show('内容没变，译文还在下面');return}
  busy=true;go.disabled=true;go.textContent='…';
  out.className='busy';out.textContent='';cp.disabled=true;eng.textContent='';
  const seq=++seqNo;
  let fastDone=false;
  /* 第一路：快译（秒级），先垫底 */
  (async()=>{
    try{
      const rf=await fetch('/fy/fast',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,target:tgtLang})});
      const df=await rf.json();
      if(seq!==seqNo||fastDone)return;
      if(df.ok&&df.translated){
        fastDone=true;
        lastText=text;lastTgt=tgtLang;lastOut=df.translated;
        out.className='rough';out.textContent=df.translated;
        cp.disabled=false;
        eng.textContent='初译完成，AI 精译中…';
      }
    }catch(e){}
  })();
  /* 第二路：GLM 精译，到了就替换 */
  try{
    const r=await fetch('/fy/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,target:tgtLang})});
    const d=await r.json();
    if(seq!==seqNo)return;
    if(!d.ok){
      if(!fastDone){out.className='empty';out.textContent='';show(d.msg||'翻译失败，请稍后再试')}
      else eng.textContent='（AI 精译没赶上，已用初译）';
    }else{
      lastText=text;lastTgt=tgtLang;lastOut=d.translated||'';
      out.className='';out.textContent=lastOut||'（没翻译出来，换个说法试试）';
      cp.disabled=!lastOut;
      eng.textContent='AI 精译 ✓';
    }
  }catch(e){
    if(seq===seqNo&&!fastDone){out.className='empty';out.textContent='';show('网络异常，请稍后再试')}
    else if(seq===seqNo)eng.textContent='（AI 精译没赶上，已用初译）';
  }
  busy=false;go.disabled=false;go.textContent='译';
}
go.onclick=()=>doTrans();
redo.onclick=()=>{lastText='';doTrans(true)};

/* 复制 */
cp.onclick=async()=>{
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(lastOut)}
    else{const ta=document.createElement('textarea');ta.value=lastOut;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}
    show('已复制到剪贴板');
  }catch(e){show('复制失败，请手动选择复制')}
};

/* 粘贴 */
paste.onclick=async()=>{
  try{
    const t=await navigator.clipboard.readText();
    if(t&&t.trim()){src.value=t.slice(0,2000);upd();doTrans(true)}
    else show('剪贴板是空的');
  }catch(e){show('浏览器不允许读剪贴板，请手动粘贴')}
};

/* 语音朗读：优先走转发站的微软朗读线（手机也出声），失败退回浏览器自带 */
let _u=null,_audio=null;
function speak(text,code){
  if(!text.trim()){show('还没有可朗读的内容');return}
  const lang=LANGS[code]?LANGS[code].t:'en-US';
  fetch('/fy/tts?l='+encodeURIComponent(lang)+'&t='+encodeURIComponent(text.slice(0,500)))
   .then(r=>{if(!r.ok)throw 0;return r.blob()})
   .then(b=>{
     if(_audio){try{_audio.pause()}catch(e){}}
     _audio=new Audio(URL.createObjectURL(b));
     _audio.onended=()=>{if(_audio){URL.revokeObjectURL(_audio.src)}};
     _audio.play().catch(()=>show('点一下页面任意处再朗读即可'));
   })
   .catch(()=>speakLocal(text,lang));
}
function speakLocal(text,lang){
  try{
    if(!window.speechSynthesis){show('朗读线路不通，请稍后再试');return}
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text.slice(0,500));
    u.lang=lang;u.rate=0.92;
    const vs=speechSynthesis.getVoices()||[];
    const v=vs.find(x=>(x.lang||'').replace('_','-').toLowerCase().startsWith(lang.slice(0,2).toLowerCase()));
    if(v)u.voice=v;
    _u=u;
    speechSynthesis.speak(u);
  }catch(e){show('当前浏览器不支持朗读')}
}
tts.onclick=()=>speak(lastOut,tgtLang);

/* 常见短语 */
const PHRASES={
 '最受欢迎的':[['Hello.','你好'],['Thank you.','谢谢'],['Good morning.','早上好'],['How are you?','你好吗'],['Nice to meet you.','见到你很高兴'],['You are welcome.','不客气']],
 '课堂用语':[['May I come in?','我可以进来吗'],['Well done!','做得好'],['Open your books.','打开书本'],['Listen carefully.','认真听'],['Any questions?','有问题吗'],['See you tomorrow.','明天见']],
 '旅行用语':[['Where is the restroom?','洗手间在哪里'],['How much is it?','多少钱'],['Excuse me.','打扰一下'],['I need help.','我需要帮助'],['Check, please.','请结账'],['Have a nice day.','祝您愉快']]
};
let curCat='最受欢迎的';
function renderCats(){
  cats.innerHTML='';
  Object.keys(PHRASES).forEach(k=>{
    const b=document.createElement('button');b.textContent=k;
    if(k===curCat)b.classList.add('on');
    b.onclick=()=>{curCat=k;renderCats();renderPhrases()};
    cats.appendChild(b);
  });
}
function renderPhrases(){
  phlist.innerHTML='';
  PHRASES[curCat].forEach(([en,zh])=>{
    const row=document.createElement('div');row.className='ph';
    const spk=document.createElement('button');spk.className='spk';spk.textContent='🔊';spk.title='朗读';
    spk.onclick=e=>{e.stopPropagation();speak(en,'en')};
    const box=document.createElement('div');
    const e1=document.createElement('div');e1.className='en';e1.textContent=en;
    const e2=document.createElement('div');e2.className='zh';e2.textContent=zh;
    box.appendChild(e1);box.appendChild(e2);
    row.appendChild(spk);row.appendChild(box);
    row.onclick=()=>{src.value=en;upd();doTrans(true);window.scrollTo({top:0,behavior:'smooth'})};
    phlist.appendChild(row);
  });
}
$('good').onclick=()=>show('谢谢鼓励！会继续加油 💪');
