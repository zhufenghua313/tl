<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PDF 转换</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316233b'/%3E%3Ctext x='32' y='33' font-size='38' text-anchor='middle' dominant-baseline='central' font-family='Segoe UI Emoji,Apple Color Emoji,Noto Color Emoji,sans-serif'%3E%F0%9F%94%84%3C/text%3E%3C/svg%3E">
<style>
:root{--deep:#14213D;--gold:#E8BC4F;--gold2:#d99e2b;--card:#16233b;--line:#2a3c5e;--ink:#EDF1F7;--sub:#8B97AC;--ok:#7fd6a4;--err:#ff9d76}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:linear-gradient(180deg,#0e1729 0%,#121d33 100%);min-height:100vh;color:var(--ink)}
.wrap{max-width:680px;margin:0 auto;padding:26px 16px 40px}
.hero{text-align:center;padding:10px 0 4px}
.hero h1{font-size:25px;letter-spacing:1px}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{color:var(--sub);font-size:12.5px;margin-top:8px;line-height:1.7}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}
.mode{background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:12px 8px;text-align:center;cursor:pointer;transition:.15s;user-select:none}
.mode .mi{font-size:21px}
.mode .mt{font-size:12.5px;font-weight:700;margin-top:5px}
.mode .md{font-size:10.5px;color:var(--sub);margin-top:2px}
.mode.on{border-color:var(--gold);background:linear-gradient(180deg,rgba(232,188,79,.13),rgba(232,188,79,.04));box-shadow:0 0 0 1px var(--gold) inset}
.mode.on .mt{color:var(--gold)}
.drop{margin-top:16px;background:rgba(232,188,79,.10);border:2px solid var(--gold);border-radius:15px;padding:34px 16px;text-align:center;cursor:pointer;transition:.15s;box-shadow:0 3px 16px rgba(232,188,79,.15)}
.drop:hover,.drop.over{background:rgba(232,188,79,.18);transform:translateY(-1px);box-shadow:0 6px 22px rgba(232,188,79,.25)}
.drop .dt{font-size:19px;font-weight:700}
.drop .dd{font-size:12px;color:var(--sub);margin-top:5px;line-height:1.7}
.opts{display:flex;gap:10px;margin-top:13px;flex-wrap:wrap;align-items:center}
.opt{background:transparent;border:1px solid var(--line);color:var(--sub);border-radius:999px;padding:7px 15px;font-size:12.5px;cursor:pointer;transition:.15s}
.opt.on{color:var(--gold);border-color:var(--gold)}
.optl{font-size:12px;color:var(--sub)}
.stage{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px}
.finfo{display:flex;align-items:center;gap:11px;padding-bottom:13px;border-bottom:1px solid rgba(255,255,255,.06)}
.finfo .fi{font-size:25px}
.finfo .fn{font-weight:700;font-size:14.5px;word-break:break-all}
.finfo .fs{font-size:11.5px;color:var(--sub);margin-top:2px}
.pbar{height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:14px}
.pbar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px;transition:width .3s}
.ptxt{font-size:12.5px;color:var(--sub);margin-top:8px;text-align:center;min-height:18px}
.ptxt.err{color:var(--err)}
.result{margin-top:15px;text-align:center}
.dlbtn{display:inline-block;background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:11px;color:#20283a;font-weight:800;font-size:15px;padding:13px 34px;cursor:pointer;text-decoration:none}
.dlbtn:active{transform:scale(.97)}
.rhint{font-size:11.5px;color:var(--sub);margin-top:9px;line-height:1.7}
.gallery{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:13px}
.gallery img{width:86px;height:112px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
footer{text-align:center;color:var(--sub);font-size:12px;padding:24px 0 0;line-height:1.9}
.ffoot{display:flex;align-items:center;justify-content:center;gap:8px}
.flogo{display:inline-flex;width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#E8BC4F,#d99e2b);align-items:center;justify-content:center;font-size:14px}
footer a{color:var(--gold);text-decoration:none}
input[type=file]{display:none}
@media(max-width:560px){.mode .md{display:none}.mode{padding:10px 4px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>PDF <em>转换</em></h1>
    <p>图片 / Word / Excel 与 PDF 互转，建议 50MB 以内</p>
  </div>

  <div class="modes" id="modes"></div>

  <div class="drop" id="drop">
    <div class="dt" id="dropTitle">点击去选择文件</div>
    <div class="dd" id="dropDesc">PDF → Word · 提取文字生成 .docx</div>
    <input type="file" id="file">
  </div>

  <div class="opts" id="opts" style="display:none">
    <span class="optl">清晰度：</span>
    <button class="opt" data-v="96">屏幕 96dpi</button>
    <button class="opt on" data-v="150">标准 150dpi</button>
    <button class="opt" data-v="300">打印 300dpi</button>
  </div>

  <div class="stage" id="stage" style="display:none">
    <div class="finfo">
      <div class="fi" id="fIcon">📄</div>
      <div>
        <div class="fn" id="fName"></div>
        <div class="fs" id="fSize"></div>
      </div>
    </div>
    <div class="pbar"><i id="pfill"></i></div>
    <div class="ptxt" id="ptxt">准备中…</div>
    <div class="result" id="result" style="display:none">
      <div class="gallery" id="gallery"></div>
      <a class="dlbtn" id="dlbtn" download>⬇ 下载结果</a>
      <div class="rhint" id="rhint"></div>
    </div>
  </div>

  <footer>
    <div><a href="/">← 返回欢乐工具站</a></div>
  </footer>
</div>

<script>

/* ===== 模式配置（10:27 站长定序：上排 PDF 往外转，下排各家转成 PDF） ===== */
const MODES = [
  {id:'pdf2word', icon:'📄', title:'PDF → Word', desc:'提取文字生成 .docx', accept:'application/pdf', multi:false, hint:'保得住文字内容，原排版会简化'},
  {id:'pdf2excel', icon:'📈', title:'PDF → Excel', desc:'提取表格生成 .xlsx', accept:'application/pdf', multi:false, hint:'文本型直接提取；照片型自动改走认字拼表（约七八成准请校对，想更准用 WPS「图片转表格」/Excel 365「来自图片的数据」）'},
  {id:'pdf2img', icon:'📷', title:'PDF → 图片', desc:'每页一张 JPG', accept:'application/pdf', multi:false, hint:'每页导出一张 JPG，多页自动打成 ZIP'},
  {id:'pdf2wordOcr', icon:'🔍', title:'扫描件 → Word', desc:'OCR 认字（扫描/拍照PDF）', accept:'application/pdf', multi:false, hint:'认字师傅上岗：印刷体约八九成准，模糊/手写会费劲；首次需下载认字模型约20MB'},
  {id:'img2pdf', icon:'🖼', title:'图片 → PDF', desc:'JPG/PNG 合成 PDF', accept:'image/jpeg,image/png,image/webp,image/bmp', multi:true, hint:'多张图片按顺序合成一个 PDF'},
];
let mode = 'pdf2word', dpi = 150, busy = false;

const $ = id => document.getElementById(id);

/* =====【09:58 修复】引擎懒加载：库不再挡按钮——选方向才下载、带进度、浏览器缓存二次秒过 ===== */
const LIBS = {
  pdfjs:  {src:'/apps/pdf/lib/pdf.min.js', g:'pdfjsLib', size:320*1024},
  worker: {src:'/apps/pdf/lib/pdf.worker.min.js', g:null, size:1087*1024, blob:true},
  pdflib: {src:'/apps/pdf/lib/pdf-lib.min.js', g:'PDFLib', size:525*1024},
  xlsx:   {src:'/apps/pdf/lib/xlsx.full.min.js', g:'XLSX', size:881*1024},
  tessjs: {src:'/apps/pdf/lib/tess/tesseract.min.js', g:'Tesseract', size:67*1024},
  jspdf:  {src:'/apps/pdf/lib/jspdf.umd.min.js', g:'jspdf', size:365*1024},
  jszip:  {src:'/apps/pdf/lib/jszip.min.js', g:'JSZip', size:97*1024},
};
const _loaded = {}; let _workerUrl = null;
function loadLib(k){
  if(_loaded[k]) return _loaded[k];
  const L = LIBS[k];
  if(L.g && window[L.g]) return (_loaded[k] = Promise.resolve());
  _loaded[k] = (async () => {
    const r = await fetch(L.src);
    if(!r.ok) throw new Error('引擎下载失败（' + r.status + '），请稍后再试');
    const total = +(r.headers.get('content-length') || L.size);
    let recvd = 0; const chunks = [];
    const reader = r.body.getReader();
    for(;;){
      const {done, value} = await reader.read();
      if(done) break;
      chunks.push(value); recvd += value.length;
      prog(.02 + .3*Math.min(1, recvd/total), `转换引擎下载中 ${Math.min(99, Math.round(recvd/total*100))}%（${L.src.split('/').pop()} · 共 ${fmtSize(total)}，仅首次较慢，之后有缓存）`);
    }
    if(L.blob) return new Blob(chunks); /* worker 走 blob URL */
    const s = document.createElement('script');
    s.src = URL.createObjectURL(new Blob(chunks, {type:'text/javascript'}));
    await new Promise((res, rej) => { s.onload = res; s.onerror = () => rej(new Error('引擎初始化失败')); document.head.appendChild(s); });
  })();
  return _loaded[k];
}
async function ensureEngine(list){
  for(const k of list){
    if(k === 'worker'){
      if(_workerUrl) continue;
      const blob = await loadLib('worker');
      _workerUrl = URL.createObjectURL(blob);
      pdfjsLib.GlobalWorkerOptions.workerSrc = _workerUrl;
    } else if(k === 'tess'){
      await loadLib('tessjs');
      /* 认字三部件带进度预取（tesseract 内部也会 fetch，此处先拉一遍喂进 HTTP 缓存，二次秒过） */
      await prefetch('/apps/pdf/lib/tess/worker.min.js', '认字引擎 1/3');
      await prefetch('/apps/pdf/lib/tess/tesseract-core-simd.wasm.js', '认字引擎 2/3');
      await prefetch('/apps/pdf/lib/tess/chi_sim.traineddata.gz', '中文认字模型 3/3');
    } else await loadLib(k);
  }
}
async function prefetch(url, label){
  const r = await fetch(url);
  if(!r.ok) throw new Error('认字模型下载失败（' + r.status + '），请稍后再试');
  const total = +(r.headers.get('content-length') || 0);
  let recvd = 0; const reader = r.body.getReader();
  for(;;){
    const {done, value} = await reader.read();
    if(done) break;
    recvd += value.length;
    if(total) prog(.02, `${label} ${Math.min(99, Math.round(recvd/total*100))}%（共 ${fmtSize(total)}，仅首次下载，之后有缓存）`);
  }
}
const modesEl = $('modes');
MODES.forEach(m => {
  const d = document.createElement('div');
  d.className = 'mode' + (m.id===mode?' on':'');
  d.innerHTML = `<div class="mi">${m.icon}</div><div class="mt">${m.title}</div><div class="md">${m.desc}</div>`;
  d.onclick = () => { if(busy) return; mode = m.id;
    document.querySelectorAll('.mode').forEach(x=>x.classList.remove('on')); d.classList.add('on');
    $('file').accept = m.accept; $('file').multiple = m.multi;
    $('dropDesc').textContent = m.title + ' · ' + m.hint; reset(); };
  modesEl.appendChild(d);
});
$('file').accept = MODES[0].accept; $('file').multiple = MODES[0].multi;

/* ===== DPI 选项 ===== */
document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
  document.querySelectorAll('.opt').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  dpi = +b.dataset.v;
});

/* ===== 拖拽 ===== */
const drop = $('drop');
drop.onclick = () => { if(!busy) $('file').click(); };
drop.ondragover = e => {e.preventDefault(); drop.classList.add('over')};
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => {e.preventDefault(); drop.classList.remove('over'); if(!busy) go([...e.dataTransfer.files])};
$('file').onchange = e => { if(e.target.files.length) go([...e.target.files]); e.target.value=''; };

function reset(){ $('stage').style.display='none'; $('result').style.display='none'; $('gallery').innerHTML=''; }
function prog(p, t){ $('pfill').style.width = Math.round(p*100)+'%'; if(t!==undefined) $('ptxt').textContent = t; }
function perr(t){ $('ptxt').textContent = t; $('ptxt').classList.add('err'); }
function fmtSize(n){ return n>1048576 ? (n/1048576).toFixed(1)+' MB' : Math.round(n/1024)+' KB'; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function save(blob, name, hint){
  const a = $('dlbtn'); a.href = URL.createObjectURL(blob); a.download = name;
  $('result').style.display = 'block'; $('rhint').innerHTML = hint || '';
  prog(1, '完成 ✓ 点击下方按钮保存');
}

/* ===== 主流程 ===== */
async function go(files){
  if(busy) return; busy = true; reset();
  $('stage').style.display = 'block'; $('ptxt').classList.remove('err');
  const f = files[0];
  $('fIcon').textContent = files.length>1 ? '🗂' : (MODES.find(m=>m.id===mode).icon);
  $('fName').textContent = files.length>1 ? `${files.length} 个文件：${f.name} 等` : f.name;
  $('fSize').textContent = files.length>1 ? '共 '+fmtSize(files.reduce((s,x)=>s+x.size,0)) : fmtSize(f.size);
  $('opts').style.display = (mode==='pdf2img') ? 'flex' : 'none';
  try{
    if(mode==='img2pdf') await img2pdf(files);
    else if(mode==='pdf2img') await pdf2img(f);
    else if(mode==='pdf2word') await pdf2word(f);
    else if(mode==='pdf2wordOcr') await pdf2wordOcr(f);
    else if(mode==='pdf2excel') await pdf2excel(f);
  }catch(err){ console.error(err); perr('转换失败：' + (err.message||err)); }
  busy = false;
}

/* ===== 1. 图片 → PDF ===== */
async function img2pdf(files){
  await ensureEngine(['pdflib']);
  prog(.1, '读取图片…');
  const imgs = files.filter(f=>/^image\//.test(f.type));
  if(!imgs.length) throw new Error('请选择图片文件（JPG / PNG）');
  const doc = await PDFLib.PDFDocument.create();
  for(let i=0;i<imgs.length;i++){
    const buf = await imgs[i].arrayBuffer();
    let img;
    try{ img = imgs[i].type==='image/png' ? await doc.embedPng(buf) : await doc.embedJpg(buf); }
    catch(e){ throw new Error(`${imgs[i].name} 不是标准 JPG/PNG（可能是不支持的编码）`); }
    /* 按图片方向铺 A4 等比页：横图横页竖图竖页 */
    const pw = 595.28, ph = 841.89;
    const land = img.width > img.height;
    const w = land ? ph : pw, h = land ? pw : ph;
    const scale = Math.min(w/img.width, h/img.height);
    const iw = img.width*scale, ih = img.height*scale;
    const page = doc.addPage([w, h]);
    page.drawImage(img, {x:(w-iw)/2, y:(h-ih)/2, width:iw, height:ih});
    prog(.1 + .7*(i+1)/imgs.length, `处理第 ${i+1}/${imgs.length} 张…`);
  }
  prog(.9, '生成 PDF…');
  const bytes = await doc.save();
  save(new Blob([bytes],{type:'application/pdf'}), '图片合集.pdf', `${imgs.length} 张图片已合成 PDF`);
}

/* ===== 2. PDF → 图片 ===== */
async function pdf2img(f){
  await ensureEngine(['pdfjs','worker','jszip']);
  const pdf = await pdfjsLib.getDocument({data: await f.arrayBuffer()}).promise;
  const n = pdf.numPages;
  if(n > 60) throw new Error('页数太多（'+n+' 页，上限 60），请分批转换');
  const blobs = [], names = [];
  for(let i=1;i<=n;i++){
    prog(.05 + .8*i/n, `第 ${i}/${n} 页上色…`);
    const page = await pdf.getPage(i);
    const vp = page.getViewport({scale:1});
    /* dpi/72 = 缩放比（PDF 坐标单位是点，1 点 = 1/72 英寸）；护栏：canvas 单边不超 12000px */
    let scale = dpi/72;
    if(vp.height*scale > 12000 || vp.width*scale > 12000) scale = 12000/Math.max(vp.height, vp.width);
    const vp2 = page.getViewport({scale});
    const cv = document.createElement('canvas');
    cv.width = Math.round(vp2.width); cv.height = Math.round(vp2.height);
    await page.render({canvasContext: cv.getContext('2d'), viewport: vp2}).promise;
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', .92));
    blobs.push(blob); names.push(`第${String(i).padStart(3,'0')}页.jpg`);
    const th = document.createElement('canvas'); th.width=86; th.height=112;
    th.getContext('2d').drawImage(cv,0,0,86,112);
    const img = new Image(); img.src = th.toDataURL('image/jpeg',.7);
    $('gallery').appendChild(img);
  }
  prog(.92, '打包…');
  if(blobs.length === 1){ save(blobs[0], names[0], '一页文档直接保存单图'); return; }
  const zip = new JSZip();
  for(let i=0;i<blobs.length;i++) zip.file(names[i], blobs[i]);
  const zblob = await zip.generateAsync({type:'blob'});
  save(zblob, 'PDF转图片.zip', `${n} 页已打成 ZIP 压缩包`);
}

/* ===== 3/4 已裁撤（13:32 站长拍板）：Word/Excel→PDF 让位 Office 自带「另存为PDF」金标准；htmlToPdf 随管道退役 ===== */

/* ===== 5. PDF → Word ===== */
async function pdf2word(f){
  await ensureEngine(['pdfjs','worker','jszip']);
  prog(.1, '解析 PDF…');
  const pdf = await pdfjsLib.getDocument({data: await f.arrayBuffer()}).promise;
  const paras = [];
  for(let i=1;i<=pdf.numPages;i++){
    prog(.1 + .6*i/pdf.numPages, `第 ${i}/${pdf.numPages} 页提取…`);
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    /* 借鉴成熟方案：按基线 y 坐标容差聚行（PDF 没有段落，只有带坐标的字） */
    const lines = [];
    for(const it of content.items){
      if(!it.str || !it.str.trim()) continue;
      const x = it.transform[4], y = it.transform[5], fs = Math.abs(it.transform[3]) || Math.abs(it.transform[0]) || 12;
      let ln = lines.find(l => Math.abs(l.y - y) <= Math.max(2.5, fs*0.35));
      if(!ln){ ln = {y, parts:[]}; lines.push(ln); }
      ln.parts.push({x, s: it.str, w: it.width || 0, fs});
    }
    lines.sort((a,b) => b.y - a.y);
    let prevY = null;
    for(const ln of lines){
      ln.parts.sort((a,b) => a.x - b.x);
      /* 借鉴成熟方案黄金公式：横向间隙 > 字号×0.18 补空格，> 字号×4 是列间隙 */
      let text = '';
      for(let j=0;j<ln.parts.length;j++){
        const p = ln.parts[j];
        if(j>0){
          const prev = ln.parts[j-1];
          const gap = p.x - (prev.x + prev.w);
          if(gap > p.fs*4) text += '   ';
          else if(gap > p.fs*0.18) text += ' ';
        }
        text += p.s;
      }
      text = text.replace(/\s{2,}/g,'  ').trim();
      if(!text) continue;
      if(prevY !== null && (prevY - ln.y) > 30 && paras.length && paras[paras.length-1] !== '') paras.push('');
      paras.push(text); prevY = ln.y;
    }
    if(i < pdf.numPages) paras.push('');
  }
  const textAll = paras.join('\n').trim();
  if(!textAll) throw new Error('这个 PDF 里没有可选中的文字——它是扫描件/照片型 PDF，请改用「扫描件 → Word」（认字版）');
  prog(.85, '生成 Word…');
  /* 最小 docx 三件套（Word/WPS 通用） */
  const docXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'
    + textAll.split('\n').map(t => t ? `<w:p><w:r><w:t xml:space="preserve">${esc(t)}</w:t></w:r></w:p>` : '<w:p/>').join('')
    + '</w:body></w:document>';
  const zip = new JSZip();
  zip.file('[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  zip.file('_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file('word/document.xml', docXml);
  const blob = await zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  save(blob, f.name.replace(/\.pdf$/i,'') + '.docx', '文字内容已提取为 Word（原排版会简化，图片不在其中）');
}

function tidyOcr(s){
  return s.split('\n').map(l => {
    l = l.replace(/(?<=[\u4e00-\u9fff\u3000-\u303f\uff00-\uffef])[ \t]+(?=[\u4e00-\u9fff\u3000-\u303f\uff00-\uffef])/g, '');
    l = l.replace(/([\u4e00-\u9fff])\s*,\s*([\u4e00-\u9fff])/g, '$1，$2');
    l = l.replace(/([\u4e00-\u9fff])\s*\.\s*([\u4e00-\u9fff])/g, '$1。$2');
    l = l.replace(/([\u4e00-\u9fff])\s*;\s*([\u4e00-\u9fff])/g, '$1；$2');
    l = l.replace(/([\u4e00-\u9fff])\s*:\s*([\u4e00-\u9fff])/g, '$1：$2');
    l = l.replace(/([\u4e00-\u9fff])\s*\?\s*([\u4e00-\u9fff])/g, '$1？$2');
    l = l.replace(/([\u4e00-\u9fff])\s*!\s*([\u4e00-\u9fff])/g, '$1！$2');
    return l;
  }).join('\n');
}
/* ===== 5b. 扫描件 PDF → Word（OCR 认字版，与文字型走完全隔离的两条路） ===== */
async function pdf2wordOcr(f){
  await ensureEngine(['pdfjs','worker','tess','jszip']);
  prog(.1, '渲染页面…');
  const pdf = await pdfjsLib.getDocument({data: await f.arrayBuffer()}).promise;
  const n = pdf.numPages;
  if(n > 30) throw new Error('扫描件认字较慢，单次上限 30 页（当前 ' + n + ' 页），请分批转换');
  const worker = await Tesseract.createWorker('chi_sim', 1, {
    /* 【11:04 修复】worker.min.js 抓内容打成 blob 直接喂给 new Worker（同 pdf.js 手法），
       绕开 blob-worker 里 importScripts 走缓存的 MIME/旧响应坑；core/模型由 worker 内部 fetch，MIME 已正章 */
    workerBlobURL: false,
    workerPath: URL.createObjectURL(new Blob([await (await fetch('/apps/pdf/lib/tess/worker.min.js')).text()], {type:'text/javascript'})),
    corePath: '/apps/pdf/lib/tess/',
    langPath: '/apps/pdf/lib/tess/',
  });
  let textAll = '';
  try{
    for(let i=1;i<=n;i++){
      prog(.1 + .75*i/n, `第 ${i}/${n} 页认字中…（扫描件认字较慢，请稍候）`);
      const page = await pdf.getPage(i);
      let scale = 2;
      const vp1 = page.getViewport({scale:1});
      if(vp1.height*scale > 12000 || vp1.width*scale > 12000) scale = 12000/Math.max(vp1.height, vp1.width);
      const vp = page.getViewport({scale});
      const cv = document.createElement('canvas');
      cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
      await page.render({canvasContext: cv.getContext('2d'), viewport: vp}).promise;
      const { data } = await worker.recognize(cv);
      /* 【13:45 出厂整理】认字师傅的口癖修正：字间空格剥掉、半角标点归中文位（英文数字间空格保留） */
      const t = tidyOcr((data.text || '').replace(/\n{2,}/g, '\n').trim());
      if(t){ if(textAll) textAll += '\n'; textAll += t; }
    }
  } finally { await worker.terminate(); }
  if(!textAll.trim()) throw new Error('认字师傅也没认出字来——这页可能太空或太模糊');
  prog(.92, '生成 Word…');
  const docXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'
    + textAll.split('\n').map(t => t ? `<w:p><w:r><w:t xml:space="preserve">${esc(t)}</w:t></w:r></w:p>` : '<w:p/>').join('')
    + '</w:body></w:document>';
  const zip = new JSZip();
  zip.file('[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  zip.file('_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file('word/document.xml', docXml);
  const blob = await zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  save(blob, f.name.replace(/\.pdf$/i,'') + '.docx', 'OCR 认字完成（印刷体约八九成准，建议通读校对一遍）');
}

/* ===== 6b. 照片型 PDF → Excel（认字拼表兜底）：认字师傅带坐标认字 → 按y聚行/按x间隙切列 → 拼表；认不动指路 WPS/Excel 365 ===== */
async function ocrExcel(f){
  await ensureEngine(['pdfjs','worker','tess','jszip','xlsx']);
  prog(.1, '照片型表格，改走认字拼表（准确性有限，完成后请校对）…');
  const pdf = await pdfjsLib.getDocument({data: await f.arrayBuffer()}).promise;
  const n = pdf.numPages;
  if(n > 30) throw new Error('照片认字较慢，单次上限 30 页（当前 ' + n + ' 页），请分批转换');
  const worker = await Tesseract.createWorker('chi_sim', 1, {
    workerBlobURL: false,
    workerPath: URL.createObjectURL(new Blob([await (await fetch('/apps/pdf/lib/tess/worker.min.js')).text()], {type:'text/javascript'})),
    corePath: '/apps/pdf/lib/tess/',
    langPath: '/apps/pdf/lib/tess/',
    logger: m => { if(m.status === 'recognizing text') prog(.3 + .5*m.progress, '认字拼表中…'); }
  });
  try {
    const aoa = [];
    for(let i=1;i<=n;i++){
      prog(.3 + .5*(i-1)/n, `第 ${i}/${n} 页认字…`);
      const page = await pdf.getPage(i);
      const vp = page.getViewport({scale: 2});
      const cv = document.createElement('canvas');
      cv.width = vp.width; cv.height = vp.height;
      await page.render({canvasContext: cv.getContext('2d'), viewport: vp}).promise;
      /* 投影抹线：横贯40%宽/纵贯35%高的长直线判为表格线抹白（去框线干扰，AB实测表头全对） */
      {
        const w2 = cv.width, h2 = cv.height;
        const id = cv.getContext('2d').getImageData(0,0,w2,h2), dd = id.data;
        const rowC = new Int32Array(h2), colC = new Int32Array(w2);
        for(let y=0;y<h2;y++){ const base=y*w2*4; for(let x=0;x<w2;x++){ const o=base+x*4; if(0.299*dd[o]+0.587*dd[o+1]+0.114*dd[o+2] < 190){ rowC[y]++; colC[x]++; } } }
        const RT = w2*0.4, CT = h2*0.28;
        for(let y=0;y<h2;y++) if(rowC[y] > RT) for(let yy=Math.max(0,y-1); yy<=Math.min(h2-1,y+1); yy++){ const b2=yy*w2*4; for(let x=0;x<w2;x++){ const o=b2+x*4; dd[o]=dd[o+1]=dd[o+2]=255; } }
        for(let x=0;x<w2;x++) if(colC[x] > CT) for(let xx=Math.max(0,x-1); xx<=Math.min(w2-1,x+1); xx++){ for(let y=0;y<h2;y++){ const o=(y*w2+xx)*4; dd[o]=dd[o+1]=dd[o+2]=255; } }
        /* 竖线段扫：逐列连续暗段 >12% 表高 = 残线，抹白（消灭假"1"） */
        {
          const isDk = (x,y) => { const o2=(y*w2+x)*4; return 0.299*dd[o2]+0.587*dd[o2+1]+0.114*dd[o2+2] < 190; };
          const segT = Math.max(10, h2*0.12);
          for(let x=0;x<w2;x++){
            let y=0;
            while(y<h2){
              if(isDk(x,y)){
                let y2=y; while(y2<h2 && isDk(x,y2)) y2++;
                if(y2-y > segT) for(let yy=Math.max(0,y-2); yy<Math.min(h2,y2+2); yy++){ const o3=(yy*w2+x)*4; dd[o3]=dd[o3+1]=dd[o3+2]=255; }
                y=y2;
              } else y++;
            }
          }
        }
        cv.getContext('2d').putImageData(id,0,0);
      }
      const out = await worker.recognize(cv, {}, {blocks:true, text:true});
      const d = out.data;
      let words = [];
      const LINEY = /^[|│丨┃一─—―_=·.'`\]\[【】『』「」、°]+$/;
      const pull = w => { if(w && w.text && w.text.trim() && !LINEY.test(w.text)) words.push({s:w.text, x:w.bbox.x0, y:w.bbox.y0, w:w.bbox.x1-w.bbox.x0, h:w.bbox.y1-w.bbox.y0}); };
      if(d.blocks) for(const b of d.blocks) for(const pr of (b.paragraphs||[])) for(const l of (pr.lines||[])) for(const w of (l.words||[])) pull(w);
      else if(d.words) for(const w of d.words) pull(w);
      /* 细长竖条过滤：又窄又高的词 = 线残渣（真数字1宽窄正常） */
      {
        const hs2 = words.map(w=>w.h).sort((a,b)=>a-b);
        const mh2 = hs2.length ? hs2[Math.floor(hs2.length/2)] : 20;
        words = words.filter(w => !(w.h > mh2*1.15 && w.w < mh2*0.4));
      }
      words.sort((a,b) => a.y - b.y);
      /* 行聚类：y 中心差 < 词高中位值×0.6 → 同行 */
      const hs = words.map(w=>w.h).sort((a,b)=>a-b);
      const midH = hs.length ? hs[Math.floor(hs.length/2)] : 20;
      const lines = [];
      for(const w of words){
        const yc = w.y + w.h/2;
        let ln = lines.find(l => Math.abs(l.y - yc) <= midH*0.6);
        if(!ln){ ln = {y:yc, parts:[]}; lines.push(ln); }
        ln.y = (ln.y*(ln.parts.length) + yc)/(ln.parts.length+1);
        ln.parts.push(w);
      }
      for(const ln of lines){
        ln.parts.sort((a,b) => a.x - b.x);
        const cells = []; let cur = '';
        for(let j=0;j<ln.parts.length;j++){
          const q = ln.parts[j];
          if(j>0){
            const prev = ln.parts[j-1];
            const gap = q.x - (prev.x + prev.w);
            if(gap > midH*0.8){ cells.push(cur.trim()); cur=''; }
            else if(gap > midH*0.15) cur += ' ';
          }
          cur += q.s;
        }
        cells.push(cur.trim());
        if(cells.some(cc=>cc)) aoa.push(cells);
      }
      if(i < n && aoa.length) aoa.push([`— 第 ${i+1} 页 —`]);
    }
    for(let r=0;r<aoa.length;r++) aoa[r] = aoa[r].map(v => { let s = tidyOcr(String(v).replace(/[|│丨┃]/g,'').replace(/[\]\[【】『』「」、°]/g,''));
        if(/^[IloO0-9\s]+$/.test(s) && /[IloO]/.test(s)) s = s.replace(/I/g,'1').replace(/l/g,'1').replace(/O/g,'0').replace(/\s+/g,'');
        return s; });
    const chars = aoa.reduce((s,r)=>s+r.join('').length, 0);
    if(!chars) throw new Error('照片太模糊认不出内容——建议用 WPS APP 的「图片转表格」，或升级 Excel 365 用「数据→来自图片的数据」');
    prog(.85, '生成 Excel…');
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = Array.from({length: Math.max(...aoa.map(r=>r.length))}, () => ({wch: 22}));
    XLSX.utils.book_append_sheet(wb, ws, '认字拼表');
    const out2 = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    save(new Blob([out2],{type:'application/octet-stream'}), f.name.replace(/\.pdf$/i,'') + '.xlsx', '认字拼表完成（照片型，约七八成准，请通读校对——想更省心可用 WPS「图片转表格」或 Excel 365「来自图片的数据」）');
  } finally {
    await worker.terminate();
  }
}

/* ===== 6. PDF → Excel ===== */
async function pdf2excel(f){
  await ensureEngine(['pdfjs','worker','xlsx']);
  prog(.1, '解析 PDF…');
  const pdf = await pdfjsLib.getDocument({data: await f.arrayBuffer()}).promise;
  const aoa = [];
  for(let i=1;i<=pdf.numPages;i++){
    prog(.1 + .6*i/pdf.numPages, `第 ${i}/${pdf.numPages} 页提取…`);
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const lines = [];
    for(const it of content.items){
      if(!it.str || !it.str.trim()) continue;
      const x = it.transform[4], y = it.transform[5], fs = Math.abs(it.transform[3]) || Math.abs(it.transform[0]) || 12;
      let ln = lines.find(l => Math.abs(l.y - y) <= Math.max(2.5, fs*0.35));
      if(!ln){ ln = {y, parts:[]}; lines.push(ln); }
      ln.parts.push({x, s: it.str, w: it.width || 0, fs});
    }
    lines.sort((a,b) => b.y - a.y);
    for(const ln of lines){
      ln.parts.sort((a,b) => a.x - b.x);
      /* 列切分：横向间隙 > 字号×0.8 → 换列；列内小间隙 > 字号×0.18 补空格 */
      const cells = []; let cur = '';
      for(let j=0;j<ln.parts.length;j++){
        const p = ln.parts[j];
        if(j>0){
          const prev = ln.parts[j-1];
          const gap = p.x - (prev.x + prev.w);
          if(gap > Math.max(p.fs, 8) * 0.8){ cells.push(cur.trim()); cur=''; }
          else if(gap > p.fs*0.18) cur += ' ';
        }
        cur += p.s;
      }
      cells.push(cur.trim());
      if(cells.some(c=>c)) aoa.push(cells);
    }
    if(i < pdf.numPages && aoa.length) aoa.push([`— 第 ${i+1} 页 —`]);
  }
  if(!aoa.length) return ocrExcel(f); /* 照片型 → 认字拼表兜底（13:58 站长拍板） */
  prog(.85, '生成 Excel…');
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = Array.from({length: Math.max(...aoa.map(r=>r.length))}, () => ({wch: 22}));
  XLSX.utils.book_append_sheet(wb, ws, 'PDF提取');
  const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  save(new Blob([out],{type:'application/octet-stream'}), f.name.replace(/\.pdf$/i,'') + '.xlsx', '表格数据已提取（文本型直提；若走认字版请校对）');
}
