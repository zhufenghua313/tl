<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<style>
  :root{--deep:#14213D;--deep2:#1B2A4A;--deep3:#2A4370;--gold:#D9A521;--goldL:#E8BC4F;--goldbg:#FBF6E9;--bg:#F4F6FA;--card:#fff;--line:#DFE4EC;--ink:#1A2233;--sub:#5B6577;--err:#B03A2E;--ok:#2E7D4F;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
  .wrap{max-width:860px;margin:0 auto;padding:22px 16px 70px;}
  nav{position:sticky;top:0;z-index:50;background:rgba(20,33,61,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(217,165,33,.25);}
  .nav-in{flex-wrap:wrap;max-width:860px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .nav-title{color:#fff;font-size:17px;font-weight:600;}
  .btn-out{background:rgba(255,255,255,.08);color:rgba(255,255,255,.92);border:1.5px solid rgba(255,255,255,.5);border-radius:9px;font-size:14px;padding:7px 14px;cursor:pointer;font-family:inherit;font-weight:600;}.crumbs{display:flex;gap:2px;align-items:center;justify-content:center;font-size:13px;padding:5px 10px 7px;background:rgba(0,0,0,.20);flex-wrap:wrap}.crumbs a{color:#E8BC4F;text-decoration:none;padding:4px 7px;border-radius:6px;flex-shrink:0}.crumbs a:active{background:rgba(255,255,255,.15)}.crumbs b{color:rgba(255,255,255,.95);font-weight:600;flex-shrink:0}.crumbs .sep{color:rgba(255,255,255,.35);flex-shrink:0}
  .hero{background:linear-gradient(120deg,var(--deep),var(--deep2) 60%,var(--deep3));color:#fff;padding:38px 20px 34px;text-align:center;position:relative;overflow:hidden;}
  .hero::before{content:"";position:absolute;left:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:rgba(217,165,33,.10);}
  .hero h1{font-size:26px;letter-spacing:2px;}
  .hero h1 em{font-style:normal;color:var(--goldL);}
  .hero p{font-size:13.5px;opacity:.85;margin-top:8px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px;box-shadow:0 3px 14px rgba(20,33,61,.06);}
  .card h2{font-size:17px;color:var(--deep);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .card h2::before{content:"";display:inline-block;width:4px;height:18px;background:var(--gold);border-radius:2px;}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .btn{border:none;border-radius:10px;padding:11px 20px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn-gold{background:linear-gradient(135deg,var(--gold),var(--goldL));color:#14213D;}
  .btn-ghost{background:#fff;color:var(--deep);border:1px solid var(--line);}
  .msg{font-size:13.5px;margin-top:6px;min-height:20px;}
  .msg.ok{color:var(--ok);}.msg.err{color:var(--err);}
  .paper{background:#fff;border:1px solid #C9D2E0;border-radius:4px;box-shadow:0 3px 12px rgba(20,33,61,.10);padding:42px 46px;margin:16px auto;max-width:760px;position:relative;}
  .pv-tag{position:absolute;top:10px;right:12px;font-size:11px;color:#98A2B3;background:#F0F3F8;border-radius:6px;padding:2px 8px;}
  .doc h2{text-align:center;font-size:20pt;font-family:"SimHei";margin:6pt 0 14pt;}
  .doc .sub{text-align:center;font-size:10.5pt;color:#555;margin-bottom:16pt;}
  .doc table{width:100%;border-collapse:collapse;}
  .doc th,.doc td{border:1px solid #444;padding:5pt 4pt;text-align:center;font-size:10.5pt;}
  .doc th{background:#EFEBE0;font-family:"SimHei";}
  .doc .top1{background:#FFF7E0;}
  .doc .top2{background:#F6F6F6;}
  .doc .top3{background:#FDF3E7;}
  .doc .r1{font-weight:bold;color:#B8860B;}
  .rec-badge{color:#B03A2E;font-weight:bold;}
  footer{text-align:center;font-size:12.5px;color:var(--sub);margin-top:26px;line-height:1.8;}
  .grade-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .gtab{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;font-size:13.5px;cursor:pointer;font-family:inherit;color:var(--ink);}
  .gtab.act{background:var(--deep);color:#fff;border-color:var(--deep);}
  .empty{text-align:center;color:var(--sub);padding:30px 0;font-size:14px;}
  .lamp{width:10px;height:10px;border-radius:50%;background:#E8BC4F;box-shadow:0 0 8px #E8BC4F;animation:br 2s infinite;}
  @keyframes br{50%{opacity:.35;}}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;} /* 【v4.77】手机端宽表横向滑动 */
table.grid{min-width:640px;font-size:12px;}
table.grid th,table.grid td{border:1px solid #B8AC8F;padding:4px 6px;text-align:center;}
table.grid th{white-space:normal;line-height:1.3;} /* 【v4.79】列头两行；td 保持单行 */
table.grid td{white-space:nowrap;}
table.grid th{background:#F7F1E3;color:#5B4A1E;font-weight:bold;}
table.grid td.c-cls,table.grid th.c-cls{text-align:left;min-width:88px;background:#FBF7EC;font-weight:bold;color:#1B2A4A;}
table.grid td.c-sum,table.grid th.c-sum{background:#FBF7EC;}
table.grid td.c-rank,table.grid th.c-rank{background:#FBF7EC;width:44px;}
table.rec-tbl{margin-top:8pt;}
table.rec-tbl th,table.rec-tbl td{border:1px solid #444;padding:4pt;text-align:center;font-size:10.5pt;}
table.rec-tbl th{background:#EFEBE0;}
@media print{ /* 【v4.77】A4 打印：每级部一页，字号收紧塞得下 */
  .tbl-wrap{overflow:visible;}
  table.grid{min-width:0;font-size:8.5pt;}
  table.grid th,table.grid td{padding:2.5pt 3pt;}
  .paper{box-shadow:none;border:none;margin:0;padding:0;page-break-after:always;}
  .pv-tag{display:none;}
}
@page{size:A4 portrait;margin:12mm;}
</style>
<style>
  header.top{background:linear-gradient(120deg,#14213D,#1B2A4A);color:#fff;border-radius:16px;padding:24px 26px;margin:16px 0;position:relative;overflow:hidden;}
  header.top h1{font-size:21px;margin:0 0 6px;}

<body>
<nav><div class="nav-in"><div class="brand" style="color:#fff;display:flex;align-items:center;gap:10px;flex-shrink:0"><span style="display:inline-block;flex-shrink:0;font-size:22px;line-height:1;align-self:center;animation:br 2s infinite">🏃</span><div><b style="display:block;font-size:17px;line-height:1.2;color:#E8BC4F">运动会</b><span style="display:block;font-size:12px;line-height:1.2;color:#E8BC4F;opacity:.8">管理系统</span></div></div>
  <div style="display:flex;gap:8px;align-items:center;flex-shrink:0;">
    <button type="button" id="btnOut" style="background:rgba(255,255,255,.08);color:rgba(255,255,255,.92);border:1.5px solid rgba(255,255,255,.5);border-radius:9px;font-size:14px;padding:7px 14px;cursor:pointer;font-family:inherit;font-weight:600;">🚪 退出登录</button>
  </div>
</div>
<div class="crumbs"><a href="/apps/sports/home.html">班主任工作台</a><span class="sep">›</span><b>汇总统计</b></div>
</nav>

<div class="wrap">
<header class="top">
    <h1>汇总导出</h1>
    <p>主席台宣读版（A4 / Word）——成绩汇总一键输出</p>
  </header>
  <div class="card">
    <h2>🖨 导出选项</h2>
    <div class="btnrow">
      <button class="btn btn-gold" type="button" id="btnWord">⬇ 下载 Word 版（A4）</button>
      <button class="btn btn-ghost" type="button" id="btnPrint">🖨 打印 / 存 PDF</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="hint" style="font-size:13px;color:var(--sub);line-height:1.8">
      汇总规则：同年级平行班比较；男女分开计分；破纪录单独加分（详见积分榜规则行）。<br>
      数据来自成绩录入（M7）→ 计分引擎（M8）实时计算——无需手动汇总。
    </div>
  </div>

  <div id="papers">
    <div class="empty">加载中…</div>
  </div>

  <footer>运动会管理系统 · M9 汇总导出 ｜ 手搓 v2【v4.79】｜ 班名4.1班格式 · 列头两行 · 各级部只列本年级项目<br>规则金标准：站长的老版计分Excel ｜ A4 版式：送主席台宣读 ｜ 手机端横向滑动查看</footer>
</div>

<script>
function el(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
var DATA=null;

/* 年级分组：从班级名提取"X年级" */
function gradeOf(cn){
  var m={"一":1,"二":2,"三":3,"四":4,"五":5,"六":6};
  for(var ch of String(cn)){if(m[ch])return m[ch];}
  return 0;
}
function gName(g){return ["","一年级","二年级","三年级","四年级","五年级","六年级"][g]||"其他";}

/* 【v4.77】生成 A4 纸页：每级部一张金标准宽表（单位+各项目得分+总分+名次），不再出全校总榜 */
function gradeSortKey(cn){ /* "四年级1班"→级部+班号，保证 1班→2班…顺序 */
  var g=gradeOf(cn)||9;
  var m=String(cn).match(/(\d+)\s*班/);
  return g*100+(m?parseInt(m[1],10):99);
}
var CN2NUM={"一":1,"二":2,"三":3,"四":4,"五":5,"六":6};
function shortCls(cls){ /* 【v4.79】班名缩短：四年级1班→4.1班（金标准格式），无班号原样 */
  var m=String(cls).match(/^([一二三四五六])年级(\d+)班$/);
  return m?(CN2NUM[m[1]]+"."+m[2]+"班"):cls;
}
function evHead(ev){ /* 【v4.79】列头拆两行：男子<br>60米 / 4×100米<br>混合接力 —— 宽度再省一半 */
  return esc(evShort(ev))
    .replace(/^(男子|女子)/,"$1<br>")
    .replace(/((?:\d+×\d+|\d+)米)(?=[^<\s])/,  "$1<br>"); /* 【v4.79】只在后面还有字才断，避免尾部空<br> */
}
function evShort(ev){ /* 【v4.78】列名精简：剥"X年级"前缀+去"预/决赛"字样（标题已有年级） */
  return String(ev).replace(/^[一二三四五六]+年级/,"").replace(/(预决赛|预赛|决赛)/g,"");
}
function evGradeOf(ev){ /* 场次归属年级：名字带前缀按前缀；不带→按得分班级年级兜底（接力场跨年级时归众数年级） */
  var g=gradeOf(ev);
  if(g)return g;
  var votes={};
  (det[ev]||[]).forEach(function(it){
    if(!it.className)return;
    var cg=gradeOf(it.className)||0;
    votes[cg]=(votes[cg]||0)+1;
  });
  var best=0,n=0;
  Object.keys(votes).forEach(function(k){ if(votes[k]>n){n=votes[k];best=Number(k);} });
  return best;
}
function buildPapers(){
  var tot=DATA.classTotals||{};
  var det=DATA.detail||{};
  var recLog=DATA.recLog||[];
  var evNames=(DATA.eventNames&&DATA.eventNames.length)?DATA.eventNames.slice():Object.keys(det);
  var classes=(DATA.classNames&&DATA.classNames.length)?DATA.classNames.slice():Object.keys(tot);
  /* 班级+有接力得分但不在班级表的队名兜底 */
  Object.keys(det).forEach(function(ev){
    det[ev].forEach(function(it){ if(it.className&&classes.indexOf(it.className)<0)classes.push(it.className); });
  });
  var byGrade={};
  classes.forEach(function(cls){
    var g=gradeOf(cls)||0;
    if(!byGrade[g])byGrade[g]=[];
    byGrade[g].push(cls);
  });
  /* 班×项目得分矩阵 */
  var cell={}; /* cls|ev → 分 */
  Object.keys(det).forEach(function(ev){
    det[ev].forEach(function(it){
      if(!it.className)return;
      var k=it.className+"\u0001"+ev;
      cell[k]=(cell[k]||0)+(it.pts||0)+(it.recPts||0);
    });
  });
  /* 【v4.78】场次按年级归属分组（保持 events_json 原顺序） */
  var evByGrade={};
  evNames.forEach(function(ev){
    var g=evGradeOf(ev);
    if(!evByGrade[g])evByGrade[g]=[];
    evByGrade[g].push(ev);
  });
  var html="";
  Object.keys(byGrade).sort(function(a,b){return a-b}).forEach(function(g){
    var arr=byGrade[g].slice().sort(gradeSortKey); /* 行序=班号序（金标准） */
    var evG=(evByGrade[Number(g)]||[]).slice(); /* 本年级场次=本年级表的列（其他年级场次不进） */
    /* 行内接力兜底队名（不在班级表的）也按年级归列 */
    var gN=Number(g);
    var gcls=arr;
    /* 名次：总分降序，同分并列同名次 */
    var ranked=gcls.map(function(c){return {cls:c,pts:tot[c]||0};}).sort(function(a,b){return b.pts-a.pts});
    var rankMap={};
    ranked.forEach(function(it,i){ rankMap[it.cls]=(i>0&&ranked[i-1].pts===it.pts)?rankMap[ranked[i-1].cls]:(i+1); });
    html+='<div class="paper"><span class="pv-tag">A4 · '+gName(Number(g)||0)+'</span><div class="doc">';
    html+='<h2>'+(Number(g)?gName(Number(g)):"其他")+'运动会总成绩</h2><div class="sub">（平行班比较 · 男女分开计分 · 破纪录另加 · 名次并列同分）</div>';
    html+='<div class="tbl-wrap"><table class="grid"><tr><th class="c-cls">单位</th>';
    evG.forEach(function(ev){ html+='<th>'+evHead(ev)+'</th>'; });
    html+='<th class="c-sum">总分</th><th class="c-rank">名次</th></tr>';
    gcls.forEach(function(cls){
      var r=rankMap[cls];
      var top=r<=3?(" top"+r):"";
      html+='<tr'+top+'><td class="c-cls">'+esc(shortCls(cls))+'</td>';
      evG.forEach(function(ev){ var v=cell[cls+"\u0001"+ev]||0; html+='<td>'+(v||"")+'</td>'; });
      html+='<td class="c-sum"><b>'+(tot[cls]||0)+'</b></td><td class="c-rank"><span class="r1">'+(r||"")+'</span></td></tr>';
    });
    if(!gcls.length)html+='<tr><td colspan="'+(evG.length+3)+'">本级部暂无班级数据</td></tr>';
    html+='</table></div>';
    /* 本年级破纪录（沿用原有块，样式收窄） */
    var recs=recLog.filter(function(r){
      var cls=(function(){ /* recLog 只有 no——从 detail 反查班级 */
        for(var ev in det){ var hit=det[ev].filter(function(x){return x.no===r.no&&x.name===r.name;})[0]; if(hit&&hit.className)return hit.className; }
        return "";
      })();
      return gradeOf(cls)===Number(g);
    });
    if(recs.length){
      html+='<div style="height:14pt"></div><table class="rec-tbl"><tr><th colspan="4">本年级破纪录</th></tr><tr><th>场次</th><th>号码</th><th>姓名</th><th>加分</th></tr>';
      recs.forEach(function(r){html+='<tr><td>'+esc(r.event)+'</td><td>'+esc(r.no)+'</td><td>'+esc(r.name)+'</td><td><span class="rec-badge">+'+r.extra+'</span></td></tr>';});
      html+='</table>';
    }
    html+='</div></div>';
  });
  el("papers").innerHTML=html;
}

/* Word 下载（Blob .doc，同M5套路但字符串已拆串） */
function downloadWord(){
  var inner=el("papers").innerHTML;
  var doc='<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8">'
    +'<title>成绩汇总表</title>'
    +'<style>@page{size:A4 portrait;margin:2cm}body{font-family:"SimSun";font-size:12pt;color:#000}'
    +'.paper{page-break-after:always;width:100%;padding:0;margin:0;border:none;box-shadow:none;min-height:0}'
    +'.paper:last-child{page-break-after:auto}'
    +'h2{text-align:center;font-family:"SimHei";font-size:16pt}table{width:100%;border-collapse:collapse}th,td{border:1px solid #444;padding:5pt;text-align:center;font-size:10.5pt}'
    +'th{background:#EFEBE0;font-family:"SimHei"}.sub{text-align:center;font-size:10.5pt;color:#555;margin-bottom:14pt}'
    +'.top1{background:#FFF7E0}.top2{background:#F6F6F6}.top3{background:#FDF3E7}.r1{font-weight:bold;color:#B8860B}'
    +'.pv-tag{display:none}.rec-badge{color:#B03A2E;font-weight:bold}'
    +'</style></head><body>'+inner+'</bo'+'dy></html>'; /* 拆串防注入误匹配 */
  var blob=new Blob(["\ufeff"+doc],{type:"application/msword"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="运动会成绩汇总表.doc";
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}

el("btnWord").addEventListener("click",downloadWord);
el("btnPrint").addEventListener("click",function(){window.print();});
el("btnOut").addEventListener("click",function(){
  fetch("/soft/__auth/logout",{method:"POST"}).then(function(){location.replace(location.pathname)})
  .catch(function(){location.replace(location.pathname)});
});

fetch("/soft/api/standings",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
  if(!d.ok){el("msg").className="msg err";el("msg").textContent=d.msg||"加载失败";return;}
  DATA=d;buildPapers();
}).catch(function(){el("papers").innerHTML='<div class="empty">网络异常，请刷新重试</div>';});
</script>
